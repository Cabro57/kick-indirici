name: release

# v1.2.3 etiketi atilinca: exe + kurucu + zip + manifest derlenir, bu deponun release'lerine yuklenir.
# Uygulama-ici guncelleyici manifest.json'u okur ve yalnizca degisen dosyalari indirir.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # sabit surum: her derlemede ayni ffmpeg.exe cikar, guncellemede yeniden indirilmez
  FFMPEG_VERSION: "9.0.2"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Surum etiketle ayni mi
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^VERSION = \"$v\"" src/kickindir/config.py || { echo "src/kickindir/config.py icindeki VERSION $v degil"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Dil dosyalari eksiksiz mi
        run: python tools/check_i18n.py

      - name: Bagimliliklar
        run: pip install -r requirements.txt

      - name: ffmpeg
        shell: bash
        run: |
          curl -fsSL -o ffmpeg.zip "https://github.com/GyanD/codexffmpeg/releases/download/$FFMPEG_VERSION/ffmpeg-$FFMPEG_VERSION-essentials_build.zip"
          7z e ffmpeg.zip "*/bin/ffmpeg.exe" -odist -y

      - name: exe
        run: python -m PyInstaller --noconfirm KickIndirici.spec

      - name: Kurucu ve zip
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\KickIndirici.iss
          Compress-Archive -Path dist\KickIndirici.exe, dist\ffmpeg.exe, installer\LICENSE-ffmpeg.txt -DestinationPath "dist\KickIndirici-$env:VERSION-windows.zip"

      - name: Manifest
        shell: bash
        run: |
          cp installer/LICENSE-ffmpeg.txt dist/
          python tools/make_manifest.py --version "$VERSION" \
            --base-url "https://github.com/Cabro57/kick-indirici/releases/download/$GITHUB_REF_NAME" \
            --installer "KickIndirici-Setup-$VERSION.exe" --out dist/manifest.json \
            KickIndirici.exe=dist/KickIndirici.exe ffmpeg.exe=dist/ffmpeg.exe LICENSE-ffmpeg.txt=dist/LICENSE-ffmpeg.txt

      - name: Surumu yayinla
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/KickIndirici-Setup-$VERSION.exe" "dist/KickIndirici-$VERSION-windows.zip" \
            dist/manifest.json dist/KickIndirici.exe dist/ffmpeg.exe dist/LICENSE-ffmpeg.txt \
            -R "$GITHUB_REPOSITORY" --title "Kick İndirici $VERSION" --generate-notes
